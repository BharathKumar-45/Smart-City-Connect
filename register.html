
{% extends "base.html" %}

{% block title %}Create Account | SmartCity Connect{% endblock %}

{% block content %}
<section class="page-heading">
    <span class="eyebrow">SMARTCITY CONNECT</span>
    <h1>Create Your Account</h1>
    <p>Register to report and track city issues.</p>
</section>

<form class="form-card register-card" method="POST"
      action="{{ url_for('register') }}">

    <div class="form-grid">

        <div class="form-group full-width register-icon-group">
            <label for="name">Full Name</label>
            <div class="register-input-wrap">
                <span class="register-field-icon" aria-hidden="true">👤</span>
                <input id="name" name="name" type="text"
                       placeholder="Enter your full name"
                       maxlength="100" required autocomplete="name">
            </div>
        </div>

        <div class="form-group full-width register-icon-group">
            <label for="email">Email Address</label>
            <div class="register-input-wrap">
                <span class="register-field-icon" aria-hidden="true">✉</span>
                <input id="email" name="email" type="email"
                       placeholder="Enter your email address"
                       maxlength="254" required autocomplete="email">
            </div>
        </div>

        <div class="form-group full-width register-icon-group">
            <label for="password">Create Password</label>
            <div class="register-input-wrap">
                <span class="register-field-icon" aria-hidden="true">🔒</span>
                <input id="password" name="password" type="password"
                       placeholder="Create a password"
                       minlength="8" required autocomplete="new-password">
            </div>
            <small>Use at least 8 characters.</small>
        </div>

    </div>

    <button class="button register-submit" type="submit">
        Create Account
    </button>

    <p class="form-note register-footer">
        Already registered?
        <a href="{{ url_for('login') }}">Log in</a>
    </p>

</form>
{% endblock %}
